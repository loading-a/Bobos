<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Крабик - Premium Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0fff88;
            --primary-dark: #0dcc6a;
            --secondary: #00d4ff;
            --accent: #ff00ff;
            
            --bg-dark: #0a0e13;
            --bg-card: rgba(20, 27, 38, 0.7);
            --bg-overlay: rgba(10, 14, 19, 0.8);
            
            --text-primary: #ffffff;
            --text-secondary: #8892a0;
            --text-tertiary: #5a6a7a;
            
            --border: rgba(26, 35, 50, 0.5);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.2);
            
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e13 0%, #0f1419 50%, #1a0f2e 100%);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        /* Background Glow Effects */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .glow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 20s ease-in-out infinite;
        }

        .glow-blob-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            top: -10%;
            right: -5%;
            animation-delay: 0s;
        }

        .glow-blob-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
            bottom: 10%;
            left: 5%;
            animation-delay: 7s;
        }

        .glow-blob-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 14s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }
            33% {
                transform: translate(50px, -50px);
            }
            66% {
                transform: translate(-30px, 30px);
            }
        }

        /* Main Container */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            padding-top: var(--safe-area-inset-top);
            padding-bottom: var(--safe-area-inset-bottom);
        }

        .content-wrapper::-webkit-scrollbar {
            width: 6px;
        }

        .content-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .content-wrapper::-webkit-scrollbar-thumb {
            background: rgba(15, 255, 136, 0.3);
            border-radius: 3px;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(20, 27, 38, 0.5);
            border-bottom: 1px solid var(--border);
            margin-top: var(--safe-area-inset-top);
        }

        .header__logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header__logo-text {
            font-size: 16px;
        }

        .header__button {
            width: 40px;
            height: 40px;
            background: rgba(26, 35, 50, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header__button:hover {
            background: rgba(26, 35, 50, 0.9);
            color: var(--primary);
            border-color: var(--primary);
        }

        .header__button:active {
            transform: scale(0.95);
        }

        /* Content */
        .content {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Profile Card */
        .profile-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 24px;
            text-align: center;
            box-shadow: var(--shadow);
            animation: slideUp 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 255, 136, 0.05) 0%, transparent 100%);
            pointer-events: none;
        }

        .profile-card > * {
            position: relative;
            z-index: 1;
        }

        .profile__avatar {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            border: 3px solid var(--primary);
            box-shadow: 0 0 30px rgba(15, 255, 136, 0.4), inset 0 0 20px rgba(0, 212, 255, 0.1);
            position: relative;
        }

        .profile__avatar::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            bottom: -2px;
            right: -2px;
            border: 3px solid var(--bg-dark);
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 10px var(--primary);
            }
            50% {
                opacity: 0.6;
                box-shadow: 0 0 20px var(--primary);
            }
        }

        .profile__name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile__status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .profile__status-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        .profile__id {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(26, 35, 50, 0.5);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .profile__id-text {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: var(--primary);
        }

        .profile__id-copy {
            width: 28px;
            height: 28px;
            background: rgba(15, 255, 136, 0.1);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .profile__id-copy:hover {
            background: rgba(15, 255, 136, 0.2);
            color: var(--primary);
            border-color: var(--primary);
        }

        .profile__id-copy:active {
            transform: scale(0.9);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            animation: slideUp 0.6s ease-out 0.1s both;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px 12px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 255, 136, 0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 32px rgba(15, 255, 136, 0.2);
            transform: translateY(-4px);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card > * {
            position: relative;
            z-index: 1;
        }

        .stat-card__icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .stat-card__value {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .stat-card__label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Create Button */
        .btn-create {
            width: 100%;
            height: 54px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 16px;
            color: #000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(15, 255, 136, 0.4);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s ease-out 0.2s both;
            font-family: 'Inter', sans-serif;
        }

        .btn-create::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.3), transparent 50%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(15, 255, 136, 0.5);
        }

        .btn-create:active {
            transform: translateY(0);
            box-shadow: 0 4px 16px rgba(15, 255, 136, 0.3);
        }

        /* Links Section */
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-top: 12px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: slideUp 0.6s ease-out 0.3s both;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            animation: slideUp 0.6s ease-out forwards;
        }

        .link-item:nth-child(1) { animation-delay: 0.4s; }
        .link-item:nth-child(2) { animation-delay: 0.5s; }
        .link-item:nth-child(3) { animation-delay: 0.6s; }

        .link-item:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(15, 255, 136, 0.15);
            transform: translateX(4px);
        }

        .link-item__content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .link-item__name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .link-item__meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .link-item__badge {
            background: rgba(15, 255, 136, 0.1);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            border: 1px solid rgba(15, 255, 136, 0.2);
        }

        .link-item__actions {
            display: flex;
            gap: 8px;
        }

        .link-item__btn {
            width: 32px;
            height: 32px;
            background: rgba(26, 35, 50, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .link-item__btn:hover {
            background: rgba(26, 35, 50, 0.9);
            color: var(--primary);
            border-color: var(--primary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            animation: slideUp 0.6s ease-out;
        }

        .empty-state__icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: float 3s ease-in-out infinite;
        }

        .empty-state__title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-state__text {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Menu Overlay */
        .menu-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 998;
            animation: fadeIn 0.3s ease;
        }

        .menu-backdrop.active {
            display: block;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 320px;
            height: 100vh;
            background: linear-gradient(135deg, rgba(10, 14, 19, 0.95) 0%, rgba(15, 20, 30, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 999;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -8px 0 32px rgba(0, 0, 0, 0.3);
        }

        .menu-overlay.active {
            transform: translateX(0);
        }

        .menu-overlay__header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: var(--safe-area-inset-top);
        }

        .menu-overlay__title {
            font-size: 18px;
            font-weight: 700;
        }

        .menu-overlay__close {
            width: 36px;
            height: 36px;
            background: rgba(26, 35, 50, 0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .menu-overlay__close:hover {
            background: rgba(26, 35, 50, 0.9);
            color: var(--primary);
            border-color: var(--primary);
        }

        .menu-overlay__profile {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .menu-overlay__avatar {
            width: 80px;
            height: 80px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px rgba(15, 255, 136, 0.3);
        }

        .menu-overlay__name {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .menu-overlay__email {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .menu-overlay__content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-overlay__content::-webkit-scrollbar {
            width: 4px;
        }

        .menu-overlay__content::-webkit-scrollbar-thumb {
            background: rgba(15, 255, 136, 0.2);
            border-radius: 2px;
        }

        .menu-item {
            padding: 14px 16px;
            background: rgba(26, 35, 50, 0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .menu-item:hover {
            background: rgba(26, 35, 50, 0.8);
            color: var(--primary);
            border-color: var(--primary);
        }

        .menu-item__icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .menu-overlay__footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            margin-top: auto;
            margin-bottom: var(--safe-area-inset-bottom);
        }

        .menu-overlay__logout {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 12px;
            color: #ff3b30;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-overlay__logout:hover {
            background: rgba(255, 59, 48, 0.2);
            border-color: #ff3b30;
        }

        /* Animations */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .content {
                padding: 16px 12px;
                gap: 16px;
            }

            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .stat-card {
                padding: 14px 10px;
            }

            .stat-card__value {
                font-size: 24px;
            }

            .profile-card {
                padding: 20px;
            }

            .profile__avatar {
                width: 90px;
                height: 90px;
                font-size: 44px;
            }

            .profile__name {
                font-size: 20px;
            }

            .menu-overlay {
                max-width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(26, 35, 50, 0.5) 0%, rgba(26, 35, 50, 0.8) 50%, rgba(26, 35, 50, 0.5) 100%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
    </style>
</head>
<body>
    <!-- Background Glow -->
    <div class="bg-glow">
        <div class="glow-blob glow-blob-1"></div>
        <div class="glow-blob glow-blob-2"></div>
        <div class="glow-blob glow-blob-3"></div>
    </div>

    <!-- Main App -->
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header__logo">
                <span>🦀</span>
                <span class="header__logo-text">Крабик</span>
            </div>
            <button class="header__button" id="menuBtn" title="Меню">☰</button>
        </div>

        <!-- Content -->
        <div class="content-wrapper">
            <div class="content">
                <!-- Profile Card -->
                <div class="profile-card">
                    <div class="profile__avatar">🦀</div>
                    <div class="profile__name">Пользователь</div>
                    <div class="profile__status">
                        <span class="profile__status-dot"></span>
                        <span>Online</span>
                    </div>
                    <div class="profile__id">
                        <span>ID:</span>
                        <span class="profile__id-text">123456</span>
                        <button class="profile__id-copy" id="copyIdBtn" title="Копировать">📋</button>
                    </div>
                </div>

                <!-- Stats -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card__icon">⬇️</div>
                        <div class="stat-card__value">0</div>
                        <div class="stat-card__label">Получено</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card__icon">🛍️</div>
                        <div class="stat-card__value">0</div>
                        <div class="stat-card__label">Куплено</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card__icon">⏱️</div>
                        <div class="stat-card__value">0</div>
                        <div class="stat-card__label">Осталось</div>
                    </div>
                </div>

                <!-- Create Button -->
                <button class="btn-create" id="createBtn">
                    <span>✨</span>
                    <span>Создать ссылку</span>
                </button>

                <!-- Links Section -->
                <div>
                    <div class="section-title">Мои ссылки</div>
                    <div class="links-list" id="linksList">
                        <div class="empty-state">
                            <div class="empty-state__icon">🔗</div>
                            <div class="empty-state__title">Нет ссылок</div>
                            <div class="empty-state__text">Создайте первую ссылку чтобы начать</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Menu Backdrop -->
    <div class="menu-backdrop" id="menuBackdrop"></div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-overlay__header">
            <div class="menu-overlay__title">Меню</div>
            <button class="menu-overlay__close" id="menuCloseBtn">✕</button>
        </div>

        <div class="menu-overlay__profile">
            <div class="menu-overlay__avatar">🦀</div>
            <div class="menu-overlay__name">Пользователь</div>
            <div class="menu-overlay__email">ID: 123456</div>
        </div>

        <div class="menu-overlay__content">
            <div class="menu-item" id="statsMenuItem">
                <span class="menu-item__icon">📊</span>
                <span>Статистика</span>
            </div>
            <div class="menu-item" id="shopMenuItem">
                <span class="menu-item__icon">🛒</span>
                <span>Купить ссылки</span>
            </div>
            <div class="menu-item" id="bonusMenuItem">
                <span class="menu-item__icon">🎁</span>
                <span>Бонусы</span>
            </div>
            <div class="menu-item" id="historyMenuItem">
                <span class="menu-item__icon">🕘</span>
                <span>История</span>
            </div>
            <div class="menu-item" id="supportMenuItem">
                <span class="menu-item__icon">💬</span>
                <span>Поддержка</span>
            </div>
            <div class="menu-item" id="settingsMenuItem">
                <span class="menu-item__icon">⚙️</span>
                <span>Настройки</span>
            </div>
            <div class="menu-item" id="faqMenuItem">
                <span class="menu-item__icon">❓</span>
                <span>FAQ</span>
            </div>
        </div>

        <div class="menu-overlay__footer">
            <button class="menu-overlay__logout" id="logoutBtn">🚪 Выйти</button>
        </div>
    </div>

    <script>
        // Telegram Web App
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#141b26');
            tg.setBackgroundColor('#0a0e13');
        }

        // Elements
        const menuBtn = document.getElementById('menuBtn');
        const menuCloseBtn = document.getElementById('menuCloseBtn');
        const menuOverlay = document.getElementById('menuOverlay');
        const menuBackdrop = document.getElementById('menuBackdrop');
        const contentWrapper = document.querySelector('.content-wrapper');

        // Menu Management
        function openMenu() {
            menuOverlay.classList.add('active');
            menuBackdrop.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeMenu() {
            menuOverlay.classList.remove('active');
            menuBackdrop.classList.remove('active');
            document.body.style.overflow = '';
        }

        menuBtn.addEventListener('click', openMenu);
        menuCloseBtn.addEventListener('click', closeMenu);
        menuBackdrop.addEventListener('click', closeMenu);

        // Close menu on item click
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', closeMenu);
        });

        // Ripple Effect
        document.querySelectorAll('.btn-create, .header__button, .profile__id-copy, .stat-card').forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                if (btn.classList.contains('btn-create')) {
                    const rect = btn.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    btn.style.setProperty('--x', x + 'px');
                    btn.style.setProperty('--y', y + 'px');
                }
            });
        });

        // Copy ID
        document.getElementById('copyIdBtn').addEventListener('click', () => {
            const id = '123456';
            navigator.clipboard.writeText(id).then(() => {
                const btn = document.getElementById('copyIdBtn');
                const originalText = btn.textContent;
                btn.textContent = '✓';
                btn.style.color = 'var(--primary)';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.color = '';
                }, 2000);
            });
        });

        // Button Events
        document.getElementById('createBtn').addEventListener('click', () => {
            showToast('Функция создания ссылки');
        });

        document.getElementById('statsMenuItem').addEventListener('click', () => {
            showToast('📊 Статистика');
            closeMenu();
        });

        document.getElementById('shopMenuItem').addEventListener('click', () => {
            showToast('🛒 Купить ссылки');
            closeMenu();
        });

        document.getElementById('bonusMenuItem').addEventListener('click', () => {
            showToast('🎁 Бонусы');
            closeMenu();
        });

        document.getElementById('historyMenuItem').addEventListener('click', () => {
            showToast('🕘 История');
            closeMenu();
        });

        document.getElementById('supportMenuItem').addEventListener('click', () => {
            showToast('💬 Поддержка');
            closeMenu();
        });

        document.getElementById('settingsMenuItem').addEventListener('click', () => {
            showToast('⚙️ Настройки');
            closeMenu();
        });

        document.getElementById('faqMenuItem').addEventListener('click', () => {
            showToast('❓ FAQ');
            closeMenu();
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (tg) {
                tg.sendData(JSON.stringify({ action: 'logout' }));
            }
            closeMenu();
        });

        // Toast Notification
        function showToast(message) {
            if (tg) {
                tg.showAlert(message);
            } else {
                alert(message);
            }
        }

        // Haptic Feedback
        function hapticFeedback(type = 'light') {
            if (tg?.HapticFeedback) {
                if (type === 'light') {
                    tg.HapticFeedback.impactOccurred('light');
                } else if (type === 'medium') {
                    tg.HapticFeedback.impactOccurred('medium');
                } else if (type === 'heavy') {
                    tg.HapticFeedback.impactOccurred('heavy');
                }
            }
        }

        // Add haptic feedback to buttons
        document.querySelectorAll('.btn-create, .header__button, .menu-item, .stat-card').forEach(btn => {
            btn.addEventListener('click', () => hapticFeedback('light'));
        });

        // Example links data
        const links = [
            { id: 1, name: 'Ссылка 1', status: 'active', date: '28 июня', uses: 42 },
            { id: 2, name: 'Ссылка 2', status: 'active', date: '25 июня', uses: 18 },
            { id: 3, name: 'Ссылка 3', status: 'inactive', date: '20 июня', uses: 5 }
        ];

        function renderLinks() {
            const linksList = document.getElementById('linksList');
            
            if (links.length === 0) {
                linksList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state__icon">🔗</div>
                        <div class="empty-state__title">Нет ссылок</div>
                        <div class="empty-state__text">Создайте первую ссылку чтобы начать</div>
                    </div>
                `;
                return;
            }

            linksList.innerHTML = links.map(link => `
                <div class="link-item">
                    <div class="link-item__content">
                        <div class="link-item__name">${link.name}</div>
                        <div class="link-item__meta">
                            <span class="link-item__badge">${link.status === 'active' ? '✓ Active' : '✗ Inactive'}</span>
                            <span>${link.date}</span>
                            <span>📊 ${link.uses} использований</span>
                        </div>
                    </div>
                    <div class="link-item__actions">
                        <button class="link-item__btn" title="Копировать">📋</button>
                        <button class="link-item__btn" title="Меню">⋮</button>
                    </div>
                </div>
            `).join('');

            // Add event listeners to copy buttons
            document.querySelectorAll('.link-item__btn').forEach((btn, index) => {
                if (index % 2 === 0) {
                    btn.addEventListener('click', () => {
                        hapticFeedback('light');
                        showToast('Ссылка скопирована');
                    });
                }
            });
        }

        // Initial render
        renderLinks();

        // Safe area support
        const updateSafeArea = () => {
            const insetTop = window.getComputedStyle(document.documentElement).getPropertyValue('--safe-area-inset-top') || '0px';
            const insetBottom = window.getComputedStyle(document.documentElement).getPropertyValue('--safe-area-inset-bottom') || '0px';
        };

        window.addEventListener('resize', updateSafeArea);
        updateSafeArea();
    </script>
</body>
</html>
