<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Крабик - Enterprise Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0fff88;
            --primary-dark: #0dcc6a;
            --primary-light: #2fff99;
            --secondary: #00d4ff;
            --secondary-dark: #0099cc;
            --accent: #00a8e8;
            --accent-dark: #006699;
            
            --bg-0: #020304;
            --bg-1: #030507;
            --bg-2: #04070b;
            --bg-3: #05090e;
            --bg-card: rgba(8, 12, 18, 0.9);
            --bg-overlay: rgba(2, 3, 4, 0.98);
            
            --text-primary: #f0f3f7;
            --text-secondary: #a8b2bc;
            --text-tertiary: #6a7280;
            
            --border: rgba(15, 255, 136, 0.08);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            --shadow-lg: 0 30px 80px rgba(0, 0, 0, 0.8);
            --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.5);
            
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #020304 0%, #030507 25%, #04070b 50%, #05090e 75%, #030a0f 100%);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        /* Advanced Dark Background Effects */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .glow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.08;
        }

        .glow-blob-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            top: -15%;
            right: -10%;
            animation: float1 25s ease-in-out infinite;
        }

        .glow-blob-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
            bottom: 5%;
            left: 0%;
            animation: float2 28s ease-in-out infinite;
        }

        .glow-blob-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            top: 40%;
            left: 40%;
            animation: float3 30s ease-in-out infinite;
        }

        .glow-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(15, 255, 136, 0.05), transparent);
            animation: slideX 8s ease-in-out infinite;
        }

        .glow-line-1 {
            width: 300px;
            height: 1px;
            top: 25%;
            left: -300px;
            animation-delay: 0s;
        }

        .glow-line-2 {
            width: 250px;
            height: 2px;
            top: 65%;
            left: 100%;
            animation-delay: 2s;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(100px, -80px); }
            66% { transform: translate(-50px, 50px); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(-80px, -100px); }
            66% { transform: translate(60px, 40px); }
        }

        @keyframes float3 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(70px, 80px); }
            66% { transform: translate(-100px, -60px); }
        }

        @keyframes slideX {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(calc(100vw + 300px)); }
        }

        /* Main Container */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            padding-top: var(--safe-area-inset-top);
            padding-bottom: calc(var(--safe-area-inset-bottom) + 20px);
        }

        .content-wrapper::-webkit-scrollbar {
            width: 8px;
        }

        .content-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .content-wrapper::-webkit-scrollbar-thumb {
            background: rgba(15, 255, 136, 0.12);
            border-radius: 4px;
        }

        .content-wrapper::-webkit-scrollbar-thumb:hover {
            background: rgba(15, 255, 136, 0.2);
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            background: linear-gradient(135deg, rgba(8, 12, 18, 0.85) 0%, rgba(5, 9, 14, 0.7) 100%);
            border-bottom: 1px solid rgba(15, 255, 136, 0.06);
            margin-top: var(--safe-area-inset-top);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(15, 255, 136, 0.1), transparent);
        }

        .header__logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(15, 255, 136, 0.2);
        }

        .header__logo-icon {
            filter: drop-shadow(0 0 8px rgba(15, 255, 136, 0.3));
        }

        .header__logo-text {
            font-size: 18px;
            letter-spacing: -0.5px;
            font-weight: 800;
        }

        .header__button {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, rgba(15, 255, 136, 0.06) 0%, rgba(0, 168, 232, 0.03) 100%);
            border: 1px solid rgba(15, 255, 136, 0.12);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
        }

        .header__button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(15, 255, 136, 0.08) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 14px;
        }

        .header__button:hover {
            background: linear-gradient(135deg, rgba(15, 255, 136, 0.12) 0%, rgba(0, 168, 232, 0.06) 100%);
            color: var(--primary);
            border-color: var(--primary);
        }

        .header__button:hover::before {
            opacity: 1;
        }

        .header__button:active {
            transform: scale(0.95);
        }

        /* Content */
        .content {
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Profile Card */
        .profile-card {
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: var(--shadow);
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 255, 136, 0.05) 0%, rgba(0, 168, 232, 0.02) 100%);
            pointer-events: none;
        }

        .profile-card::after {
            content: '';
            position: absolute;
            inset: 1px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.03), transparent 50%);
            border-radius: 32px;
            pointer-events: none;
        }

        .profile-card > * {
            position: relative;
            z-index: 1;
        }

        .profile__avatar {
            width: 110px;
            height: 110px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            border: 2px solid var(--primary);
            box-shadow: 
                0 0 30px rgba(15, 255, 136, 0.3),
                0 0 60px rgba(0, 212, 255, 0.2),
                inset 0 0 20px rgba(0, 168, 232, 0.15);
            position: relative;
        }

        .profile__avatar::before {
            content: '';
            position: absolute;
            inset: -2px;
            border: 2px solid transparent;
            border-image: linear-gradient(135deg, var(--primary), var(--accent)) 1;
            border-radius: 50%;
            animation: spin 10s linear infinite;
            opacity: 0.5;
        }

        .profile__avatar::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            bottom: 0;
            right: 0;
            border: 3px solid var(--bg-0);
            box-shadow: 0 0 12px rgba(15, 255, 136, 0.6);
            animation: pulse 2s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 12px rgba(15, 255, 136, 0.6);
            }
            50% {
                opacity: 0.5;
                box-shadow: 0 0 24px rgba(15, 255, 136, 0.8);
            }
        }

        .profile__name {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .profile__status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            color: var(--primary);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .profile__status-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 8px var(--primary);
        }

        .profile__id {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(15, 255, 136, 0.08) 0%, rgba(0, 168, 232, 0.03) 100%);
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(15, 255, 136, 0.1);
            font-size: 13px;
            color: var(--text-secondary);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .profile__id-text {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .profile__id-copy {
            width: 32px;
            height: 32px;
            background: rgba(15, 255, 136, 0.1);
            border: 1px solid rgba(15, 255, 136, 0.2);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        .profile__id-copy:hover {
            background: rgba(15, 255, 136, 0.2);
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(15, 255, 136, 0.25);
        }

        .profile__id-copy:active {
            transform: scale(0.92);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.15s both;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px 16px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 255, 136, 0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            inset: 1px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.04), transparent 50%);
            border-radius: 24px;
            pointer-events: none;
        }

        .stat-card:hover {
            border-color: var(--primary);
            box-shadow: 0 12px 40px rgba(15, 255, 136, 0.15);
            transform: translateY(-6px);
            background: linear-gradient(135deg, rgba(15, 255, 136, 0.12) 0%, var(--bg-card) 100%);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card > * {
            position: relative;
            z-index: 1;
        }

        .stat-card__icon {
            font-size: 28px;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        .stat-card:nth-child(2) .stat-card__icon {
            animation-delay: 0.3s;
        }

        .stat-card:nth-child(3) .stat-card__icon {
            animation-delay: 0.6s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .stat-card__value {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
            line-height: 1;
        }

        .stat-card__label {
            font-size: 12px;
            color: var(--text-tertiary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Create Button */
        .btn-create {
            width: 100%;
            height: 58px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: 18px;
            color: #000;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 12px 40px rgba(15, 255, 136, 0.35);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.3s both;
            font-family: 'Inter', sans-serif;
        }

        .btn-create::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.3), transparent 50%);
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .btn-create::after {
            content: '';
            position: absolute;
            inset: 1px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.12), transparent 50%);
            border-radius: 18px;
            pointer-events: none;
        }

        .btn-create:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 50px rgba(15, 255, 136, 0.45);
        }

        .btn-create:active {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(15, 255, 136, 0.3);
        }

        /* Links Section */
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-top: 12px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.4s both;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-item {
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            position: relative;
            overflow: hidden;
        }

        .link-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 255, 136, 0.08) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .link-item:nth-child(1) { animation-delay: 0.5s; }
        .link-item:nth-child(2) { animation-delay: 0.6s; }
        .link-item:nth-child(3) { animation-delay: 0.7s; }

        .link-item:hover {
            border-color: var(--primary);
            box-shadow: 0 12px 40px rgba(15, 255, 136, 0.12);
            transform: translateX(6px);
        }

        .link-item:hover::before {
            opacity: 1;
        }

        .link-item > * {
            position: relative;
            z-index: 1;
        }

        .link-item__content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .link-item__name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .link-item__meta {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 12px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .link-item__badge {
            background: linear-gradient(135deg, rgba(15, 255, 136, 0.15) 0%, rgba(15, 255, 136, 0.04) 100%);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 700;
            border: 1px solid rgba(15, 255, 136, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            font-size: 10px;
        }

        .link-item__actions {
            display: flex;
            gap: 10px;
        }

        .link-item__btn {
            width: 36px;
            height: 36px;
            background: rgba(15, 255, 136, 0.08);
            border: 1px solid rgba(15, 255, 136, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        .link-item__btn:hover {
            background: rgba(15, 255, 136, 0.18);
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(15, 255, 136, 0.2);
        }

        .link-item__btn:active {
            transform: scale(0.9);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .empty-state__icon {
            font-size: 72px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
            opacity: 0.8;
        }

        .empty-state__title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .empty-state__text {
            font-size: 14px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        /* Menu Overlay */
        .menu-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 998;
            animation: fadeIn 0.4s ease;
        }

        .menu-backdrop.active {
            display: block;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 340px;
            height: 100vh;
            background: linear-gradient(135deg, rgba(2, 3, 4, 0.99) 0%, rgba(4, 7, 11, 0.98) 100%);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border-left: 1px solid var(--border);
            z-index: 999;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -12px 0 60px rgba(0, 0, 0, 0.6);
        }

        .menu-overlay.active {
            transform: translateX(0);
        }

        .menu-overlay__header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: var(--safe-area-inset-top);
        }

        .menu-overlay__title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .menu-overlay__close {
            width: 40px;
            height: 40px;
            background: rgba(15, 255, 136, 0.08);
            border: 1px solid rgba(15, 255, 136, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .menu-overlay__close:hover {
            background: rgba(15, 255, 136, 0.18);
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(15, 255, 136, 0.2);
        }

        .menu-overlay__profile {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .menu-overlay__avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 24px rgba(15, 255, 136, 0.3);
        }

        .menu-overlay__name {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }

        .menu-overlay__email {
            font-size: 13px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .menu-overlay__content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-overlay__content::-webkit-scrollbar {
            width: 6px;
        }

        .menu-overlay__content::-webkit-scrollbar-thumb {
            background: rgba(15, 255, 136, 0.12);
            border-radius: 3px;
        }

        .menu-item {
            padding: 16px 18px;
            background: linear-gradient(135deg, rgba(15, 255, 136, 0.04) 0%, rgba(0, 168, 232, 0.01) 100%);
            border: 1px solid rgba(15, 255, 136, 0.08);
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            font-size: 15px;
            color: var(--text-secondary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            position: relative;
        }

        .menu-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 255, 136, 0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 14px;
        }

        .menu-item > * {
            position: relative;
            z-index: 1;
        }

        .menu-item:hover {
            background: linear-gradient(135deg, rgba(15, 255, 136, 0.12) 0%, rgba(15, 255, 136, 0.03) 100%);
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 16px rgba(15, 255, 136, 0.15);
            transform: translateX(4px);
        }

        .menu-item__icon {
            font-size: 20px;
            width: 28px;
            text-align: center;
        }

        .menu-overlay__footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            margin-top: auto;
            margin-bottom: var(--safe-area-inset-bottom);
        }

        .menu-overlay__logout {
            width: 100%;
            padding: 14px 18px;
            background: linear-gradient(135deg, rgba(255, 59, 48, 0.12) 0%, rgba(255, 59, 48, 0.03) 100%);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 14px;
            color: #ff3b30;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: -0.3px;
        }

        .menu-overlay__logout:hover {
            background: linear-gradient(135deg, rgba(255, 59, 48, 0.2) 0%, rgba(255, 59, 48, 0.08) 100%);
            border-color: #ff3b30;
            box-shadow: 0 0 16px rgba(255, 59, 48, 0.15);
        }

        .menu-overlay__logout:active {
            transform: scale(0.98);
        }

        /* Animations */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .content {
                padding: 18px 14px;
                gap: 20px;
            }

            .header {
                height: 60px;
                padding: 0 16px;
            }

            .header__logo {
                font-size: 24px;
            }

            .header__logo-text {
                font-size: 16px;
            }

            .profile-card {
                padding: 28px 20px;
                border-radius: 28px;
            }

            .profile__avatar {
                width: 100px;
                height: 100px;
                font-size: 48px;
                margin-bottom: 20px;
            }

            .profile__name {
                font-size: 26px;
            }

            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .stat-card {
                padding: 18px 12px;
                border-radius: 20px;
            }

            .stat-card__value {
                font-size: 28px;
            }

            .stat-card__icon {
                font-size: 24px;
            }

            .btn-create {
                height: 54px;
                font-size: 16px;
                border-radius: 16px;
            }

            .menu-overlay {
                max-width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Advanced Dark Background Container -->
    <div class="bg-container">
        <div class="glow-blob glow-blob-1"></div>
        <div class="glow-blob glow-blob-2"></div>
        <div class="glow-blob glow-blob-3"></div>
        <div class="glow-line glow-line-1"></div>
        <div class="glow-line glow-line-2"></div>
    </div>

    <!-- Main App -->
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header__logo">
                <span class="header__logo-icon">🦀</span>
                <span class="header__logo-text">Крабик</span>
            </div>
            <button class="header__button" id="menuBtn" title="Меню">☰</button>
        </div>

        <!-- Content -->
        <div class="content-wrapper">
            <div class="content">
                <!-- Profile Card -->
                <div class="profile-card">
                    <div class="profile__avatar">🦀</div>
                    <div class="profile__name">Пользователь</div>
                    <div class="profile__status">
                        <span class="profile__status-dot"></span>
                        <span>Online</span>
                    </div>
                    <div class="profile__id">
                        <span>ID:</span>
                        <span class="profile__id-text">123456</span>
                        <button class="profile__id-copy" id="copyIdBtn" title="Копировать">📋</button>
                    </div>
                </div>

                <!-- Stats -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card__icon">⬇️</div>
                        <div class="stat-card__value">0</div>
                        <div class="stat-card__label">Получено</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card__icon">🛍️</div>
                        <div class="stat-card__value">0</div>
                        <div class="stat-card__label">Куплено</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card__icon">⏱️</div>
                        <div class="stat-card__value">0</div>
                        <div class="stat-card__label">Осталось</div>
                    </div>
                </div>

                <!-- Create Button -->
                <button class="btn-create" id="createBtn">
                    <span>✨</span>
                    <span>Создать ссылку</span>
                </button>

                <!-- Links Section -->
                <div>
                    <div class="section-title">Мои ссылки</div>
                    <div class="links-list" id="linksList">
                        <div class="empty-state">
                            <div class="empty-state__icon">🔗</div>
                            <div class="empty-state__title">Нет ссылок</div>
                            <div class="empty-state__text">Создайте первую ссылку чтобы начать</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Menu Backdrop -->
    <div class="menu-backdrop" id="menuBackdrop"></div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-overlay__header">
            <div class="menu-overlay__title">Меню</div>
            <button class="menu-overlay__close" id="menuCloseBtn">✕</button>
        </div>

        <div class="menu-overlay__profile">
            <div class="menu-overlay__avatar">🦀</div>
            <div class="menu-overlay__name">Пользователь</div>
            <div class="menu-overlay__email">ID: 123456</div>
        </div>

        <div class="menu-overlay__content">
            <div class="menu-item" id="statsMenuItem">
                <span class="menu-item__icon">📊</span>
                <span>Статистика</span>
            </div>
            <div class="menu-item" id="shopMenuItem">
                <span class="menu-item__icon">🛒</span>
                <span>Купить ссылки</span>
            </div>
            <div class="menu-item" id="bonusMenuItem">
                <span class="menu-item__icon">🎁</span>
                <span>Бонусы</span>
            </div>
            <div class="menu-item" id="historyMenuItem">
                <span class="menu-item__icon">🕘</span>
                <span>История</span>
            </div>
            <div class="menu-item" id="supportMenuItem">
                <span class="menu-item__icon">💬</span>
                <span>Поддержка</span>
            </div>
            <div class="menu-item" id="settingsMenuItem">
                <span class="menu-item__icon">⚙️</span>
                <span>Настройки</span>
            </div>
            <div class="menu-item" id="faqMenuItem">
                <span class="menu-item__icon">❓</span>
                <span>FAQ</span>
            </div>
        </div>

        <div class="menu-overlay__footer">
            <button class="menu-overlay__logout" id="logoutBtn">🚪 Выйти</button>
        </div>
    </div>

    <script>
        // Telegram Web App
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('transparent');
            tg.setBackgroundColor('#020304');
        }

        // Elements
        const menuBtn = document.getElementById('menuBtn');
        const menuCloseBtn = document.getElementById('menuCloseBtn');
        const menuOverlay = document.getElementById('menuOverlay');
        const menuBackdrop = document.getElementById('menuBackdrop');

        // Menu Management
        function openMenu() {
            menuOverlay.classList.add('active');
            menuBackdrop.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeMenu() {
            menuOverlay.classList.remove('active');
            menuBackdrop.classList.remove('active');
            document.body.style.overflow = '';
        }

        menuBtn.addEventListener('click', openMenu);
        menuCloseBtn.addEventListener('click', closeMenu);
        menuBackdrop.addEventListener('click', closeMenu);

        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', closeMenu);
        });

        // Swipe to close menu
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50 && menuOverlay.classList.contains('active')) {
                closeMenu();
            }
        }, false);

        // Ripple Effect
        document.querySelectorAll('.btn-create').forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                btn.style.setProperty('--x', x + 'px');
                btn.style.setProperty('--y', y + 'px');
            });
        });

        // Copy ID
        document.getElementById('copyIdBtn').addEventListener('click', () => {
            const id = '123456';
            navigator.clipboard.writeText(id).then(() => {
                const btn = document.getElementById('copyIdBtn');
                const originalText = btn.textContent;
                btn.textContent = '✓';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
                hapticFeedback('light');
            });
        });

        // Button Events
        document.getElementById('createBtn').addEventListener('click', () => {
            showToast('✨ Функция создания ссылки');
            hapticFeedback('medium');
        });

        document.getElementById('statsMenuItem').addEventListener('click', () => {
            showToast('📊 Статистика');
            hapticFeedback('light');
        });

        document.getElementById('shopMenuItem').addEventListener('click', () => {
            showToast('🛒 Купить ссылки');
            hapticFeedback('light');
        });

        document.getElementById('bonusMenuItem').addEventListener('click', () => {
            showToast('🎁 Бонусы');
            hapticFeedback('light');
        });

        document.getElementById('historyMenuItem').addEventListener('click', () => {
            showToast('🕘 История');
            hapticFeedback('light');
        });

        document.getElementById('supportMenuItem').addEventListener('click', () => {
            showToast('💬 Поддержка');
            hapticFeedback('light');
        });

        document.getElementById('settingsMenuItem').addEventListener('click', () => {
            showToast('⚙️ Настройки');
            hapticFeedback('light');
        });

        document.getElementById('faqMenuItem').addEventListener('click', () => {
            showToast('❓ FAQ');
            hapticFeedback('light');
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (tg) {
                tg.sendData(JSON.stringify({ action: 'logout' }));
            }
            hapticFeedback('heavy');
        });

        // Toast Notification
        function showToast(message) {
            if (tg) {
                tg.showAlert(message);
            } else {
                alert(message);
            }
        }

        // Haptic Feedback
        function hapticFeedback(type = 'light') {
            if (tg?.HapticFeedback) {
                if (type === 'light') {
                    tg.HapticFeedback.impactOccurred('light');
                } else if (type === 'medium') {
                    tg.HapticFeedback.impactOccurred('medium');
                } else if (type === 'heavy') {
                    tg.HapticFeedback.impactOccurred('heavy');
                }
            }
        }

        // Add haptic feedback to buttons
        document.querySelectorAll('.btn-create, .header__button, .menu-item, .stat-card, .link-item__btn').forEach(btn => {
            btn.addEventListener('click', () => hapticFeedback('light'));
        });

        // Example links data
        const links = [
            { id: 1, name: 'Ссылка 1', status: 'active', date: '28 июня', uses: 42 },
            { id: 2, name: 'Ссылка 2', status: 'active', date: '25 июня', uses: 18 },
            { id: 3, name: 'Ссылка 3', status: 'inactive', date: '20 июня', uses: 5 }
        ];

        function renderLinks() {
            const linksList = document.getElementById('linksList');
            
            if (links.length === 0) {
                linksList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state__icon">🔗</div>
                        <div class="empty-state__title">Нет ссылок</div>
                        <div class="empty-state__text">Создайте первую ссылку чтобы начать</div>
                    </div>
                `;
                return;
            }

            linksList.innerHTML = links.map(link => `
                <div class="link-item">
                    <div class="link-item__content">
                        <div class="link-item__name">${link.name}</div>
                        <div class="link-item__meta">
                            <span class="link-item__badge">${link.status === 'active' ? '✓ Active' : '✗ Inactive'}</span>
                            <span>${link.date}</span>
                            <span>📊 ${link.uses}</span>
                        </div>
                    </div>
                    <div class="link-item__actions">
                        <button class="link-item__btn" title="Копировать">📋</button>
                        <button class="link-item__btn" title="Меню">⋮</button>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.link-item__btn').forEach((btn, index) => {
                if (index % 2 === 0) {
                    btn.addEventListener('click', () => {
                        hapticFeedback('light');
                        showToast('Ссылка скопирована ✓');
                    });
                }
            });
        }

        // Initial render
        renderLinks();
    </script>
</body>
</html>
